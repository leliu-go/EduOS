server {
    listen 80;
    server_name eduos.study-go.top;

    # After certbot is configured, this block can redirect to HTTPS.
    # return 301 https://$host$request_uri;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Certbot can manage the TLS certificate paths below.
# Keep this as a template until HTTPS is enabled on ECS.
server {
    listen 443 ssl http2;
    server_name eduos.study-go.top;

    ssl_certificate /etc/letsencrypt/live/eduos.study-go.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eduos.study-go.top/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
